name: Build Wasalny APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasalny-v4-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release
        if: success() && github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.1-${{ github.run_number }}
          name: "وصلني V4.1.1 - build ${{ github.run_number }}"
          body: |
            وصلني - سيدي سالم
            - مربوط بالسيرفر
            - تعامل مع نوم Render (timeout + retry)
            - APK جاهز للتثبيت
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
